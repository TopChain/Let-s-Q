<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f0df"/>
      <stop offset="1" stop-color="#dceee7"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2667"/>
      <stop offset="1" stop-color="#168eee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f2d4c" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>
  <circle cx="912" cy="-46" r="280" fill="url(#blue)" opacity=".10"/>
  <circle cx="34" cy="518" r="190" fill="#f1b13e" opacity=".14"/>
  <rect x="64" y="86" width="550" height="328" rx="34" fill="#fffaf0" filter="url(#shadow)"/>
  <rect x="64" y="86" width="12" height="328" rx="6" fill="url(#blue)"/>
  <text x="112" y="164" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#173f5e">LET’S Q</text>
  <text x="112" y="231" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" fill="#102946">Private queues,</text>
  <text x="112" y="287" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" fill="#102946">made simple.</text>
  <text x="112" y="342" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506c78">Scan a QR code. Take your place.</text>
  <text x="112" y="376" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506c78">No name. No phone. No email.</text>
  <circle cx="777" cy="250" r="170" fill="#fff" filter="url(#shadow)"/>
  <image href="Let's Q app logo.jpeg" x="633" y="106" width="288" height="288" preserveAspectRatio="xMidYMid meet"/>
</svg>
