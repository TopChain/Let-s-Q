name: Apply queue hardening

on:
  push:
    paths:
      - scripts/apply-queue-hardening.mjs
      - .github/workflows/apply-queue-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply safe source transform
        run: node scripts/apply-queue-hardening.mjs
      - name: Verify syntax
        run: node --check live-queue.js
      - name: Commit hardened client
        shell: bash
        run: |
          if git diff --quiet -- live-queue.js; then
            echo "No queue hardening changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-queue.js
          git commit -m "Reduce live queue polling load"
          git push
