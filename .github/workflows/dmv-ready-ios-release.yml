name: Build and upload DMV Ready iOS release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-release:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out DMV Ready release branch
        uses: actions/checkout@v4
        with:
          repository: TopChain/DMVready
          ref: agent/v1.3.0-store-release

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and verify
        run: |
          npm ci
          npm run verify:release
          npm run typecheck
          npm test -- --runInBand

      - name: Generate the native iOS project
        env:
          ADMOB_ANDROID_APP_ID: ca-app-pub-5866109338835517~5668111253
          ADMOB_IOS_APP_ID: ca-app-pub-5866109338835517~3432830158
          EXPO_PUBLIC_ADMOB_ANDROID_BANNER_ID: ca-app-pub-5866109338835517/8617588085
          EXPO_PUBLIC_ADMOB_IOS_BANNER_ID: ca-app-pub-5866109338835517/7304506411
          EXPO_PUBLIC_ENABLE_TEST_ADS: 'false'
          EXPO_PUBLIC_PRIVACY_POLICY_URL: https://www.topchainfresh.com/dmv-ready/privacy/
        run: |
          npx expo prebuild --clean --platform ios --no-install
          npx pod-install ios
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 1.3.0' ios/DMVTestPrep/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 3' ios/DMVTestPrep/Info.plist

      - name: Install the authorized Apple signing identity and API key
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          test -n "$APPLE_CERTIFICATE_BASE64"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APP_STORE_CONNECT_API_KEY_BASE64"
          test "$APP_STORE_CONNECT_API_KEY_ID" = 'S2V3848CV2'
          CERTIFICATE_PATH="$RUNNER_TEMP/dmv-ready-distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/dmv-ready-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          API_KEY_PATH="$API_KEY_DIR/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          mkdir -p "$API_KEY_DIR"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          echo "API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Create and install the DMV Ready App Store profile
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          API_KEY_JSON_PATH="$RUNNER_TEMP/app-store-connect-api-key.json"
          jq -n \
            --arg key_id "$APP_STORE_CONNECT_API_KEY_ID" \
            --arg issuer_id "$APP_STORE_CONNECT_API_KEY_ISSUER_ID" \
            --arg key "$(cat "$API_KEY_PATH")" \
            '{key_id: $key_id, issuer_id: $issuer_id, key: $key, in_house: false}' > "$API_KEY_JSON_PATH"
          chmod 600 "$API_KEY_JSON_PATH"
          fastlane sigh \
            --api_key_path "$API_KEY_JSON_PATH" \
            --app_identifier com.topchainfresh.dmvready \
            --output_path "$RUNNER_TEMP" \
            --filename DMVReady_AppStore.mobileprovision
          PROFILE_PATH="$RUNNER_TEMP/DMVReady_AppStore.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/DMVReady_AppStore.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Archive DMV Ready
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          test "$APPLE_TEAM_ID" = '67JZ83U3PG'
          test "$APP_STORE_CONNECT_API_KEY_ID" = 'S2V3848CV2'
          test -n "$APP_STORE_CONNECT_API_KEY_ISSUER_ID"
          test -f "$API_KEY_PATH"
          xcodebuild archive \
            -workspace ios/DMVTestPrep.xcworkspace \
            -scheme DMVTestPrep \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DMVReady.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_KEY_ISSUER_ID"

      - name: Export and upload to App Store Connect
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :signingCertificate string Apple Distribution' "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.topchainfresh.dmvready string $PROFILE_NAME" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :stripSwiftSymbols bool true' "$EXPORT_PLIST"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DMVReady.xcarchive" \
            -exportPath "$RUNNER_TEMP/DMVReadyExport" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_KEY_ISSUER_ID"
          mkdir -p release
          cp "$RUNNER_TEMP/DMVReadyExport"/*.ipa release/DMV-Ready-1.3.0-3.ipa
          xcrun altool --validate-app \
            -f release/DMV-Ready-1.3.0-3.ipa \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_KEY_ISSUER_ID"
          xcrun altool --upload-app \
            -f release/DMV-Ready-1.3.0-3.ipa \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_KEY_ISSUER_ID"

      - uses: actions/upload-artifact@v4
        with:
          name: dmv-ready-ios-1.3.0-3
          path: release/DMV-Ready-1.3.0-3.ipa
          if-no-files-found: error
          retention-days: 14
