name: Build signed store releases

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Store artifact to build
        required: true
        default: both
        type: choice
        options:
          - both
          - android
          - ios

permissions:
  contents: read

jobs:
  android-release:
    if: ${{ inputs.platform == 'both' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run web:build
      - run: pnpm run check
      - run: pnpm exec cap sync android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Decode Google Play upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/letsq-upload.jks"
      - name: Read upload-key alias
        env:
          LETSQ_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$LETSQ_UPLOAD_STORE_PASSWORD"
          KEY_ALIAS="$(keytool -list -v -keystore "$RUNNER_TEMP/letsq-upload.jks" -storepass "$LETSQ_UPLOAD_STORE_PASSWORD" | sed -n 's/^Alias name: //p' | head -1)"
          test -n "$KEY_ALIAS"
          echo "LETSQ_UPLOAD_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
      - name: Build signed Android App Bundle
        working-directory: android
        env:
          LETSQ_UPLOAD_STORE_FILE: ${{ runner.temp }}/letsq-upload.jks
          LETSQ_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LETSQ_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$LETSQ_UPLOAD_STORE_PASSWORD"
          test -n "$LETSQ_UPLOAD_KEY_ALIAS"
          test -n "$LETSQ_UPLOAD_KEY_PASSWORD"
          ./gradlew bundleRelease --no-daemon
      - name: Verify signed bundle
        run: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: lets-q-android-1.3.5-9
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  ios-release:
    if: ${{ inputs.platform == 'both' || inputs.platform == 'ios' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run web:build
      - run: pnpm run check
      - run: pnpm exec cap sync ios
      - name: Install Apple signing identity and API key
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          test -n "$APPLE_CERTIFICATE_BASE64"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APP_STORE_CONNECT_API_KEY_BASE64"
          test -n "$APP_STORE_CONNECT_API_KEY_ID"
          CERTIFICATE_PATH="$RUNNER_TEMP/letsq-distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/letsq-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          API_KEY_PATH="$API_KEY_DIR/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          mkdir -p "$API_KEY_DIR"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          echo "API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"
      - name: Archive signed iOS app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          test -n "$APPLE_TEAM_ID"
          test -n "$APP_STORE_CONNECT_API_KEY_ID"
          test -n "$APP_STORE_CONNECT_API_ISSUER_ID"
          test -f "$API_KEY_PATH"
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LetsQ.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID"
      - name: Export App Store IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          test -n "$APP_STORE_CONNECT_API_KEY_ID"
          test -n "$APP_STORE_CONNECT_API_ISSUER_ID"
          test -f "$API_KEY_PATH"
          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string automatic' "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :stripSwiftSymbols bool true' "$EXPORT_PLIST"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LetsQ.xcarchive" \
            -exportPath "$RUNNER_TEMP/LetsQExport" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID"
          mkdir -p release
          cp "$RUNNER_TEMP/LetsQExport"/*.ipa release/LetsQ-1.3.5-2.ipa
      - name: Upload build to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          test -n "$APP_STORE_CONNECT_API_KEY_ID"
          test -n "$APP_STORE_CONNECT_API_ISSUER_ID"
          test -f "$API_KEY_PATH"
          xcrun altool --validate-app \
            -f release/LetsQ-1.3.5-2.ipa \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"
          xcrun altool --upload-app \
            -f release/LetsQ-1.3.5-2.ipa \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: lets-q-ios-1.3.5-2
          path: release/LetsQ-1.3.5-2.ipa
          if-no-files-found: error
          retention-days: 14
